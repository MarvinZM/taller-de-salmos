<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La poesía hebrea: un amigo a conocer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night-deep:#0d0b08;
    --night-mid:#1c150e;
    --night-panel:#221a11;
    --parchment:#e8ddc7;
    --parchment-dim:#b8a888;
    --gold:#c99a4e;
    --gold-bright:#e0b563;
    --wine:#7a5230;
    --wine-bright:#9c714a;
    --line:rgba(232,221,199,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--night-deep);
    color:var(--parchment);
    font-family:'Frank Ruhl Libre', serif;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  /* Warm vignette background */
  #stars{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 60% 40% at 50% 8%, rgba(201,154,78,0.14), transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(122,82,48,0.08), transparent 55%),
      linear-gradient(180deg, var(--night-mid) 0%, var(--night-deep) 45%, var(--night-deep) 100%);
  }
  .star{
    position:fixed; border-radius:50%; background:var(--parchment);
    opacity:0.15; z-index:0; pointer-events:none;
    animation:twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:0.12;}
    50%{opacity:0.65;}
  }

  .wrap{
    position:relative; z-index:1;
    max-width:760px; margin:0 auto;
    padding:48px 20px 80px;
  }

  header.top{
    text-align:center; margin-bottom:40px;
  }
  h1.title{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(32px,7.2vw,54px);
    margin:0 0 20px;
    color:var(--parchment);
    letter-spacing:0.005em;
    line-height:1.15;
  }
  .subtitle-main{
    color:var(--parchment-dim);
    font-size:clamp(17px,4.4vw,20px);
    max-width:540px; margin:0 auto 16px;
    line-height:1.75;
    font-weight:300;
  }
  .subtitle-invite{
    color:var(--gold-bright);
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(21px,5.4vw,26px);
    margin:0;
  }

  /* Progress: five lamps for the five questions */
  .lamps{
    display:flex; justify-content:center; gap:14px;
    margin:36px 0 8px;
  }
  .lamp{
    width:9px; height:9px; border-radius:50%;
    background:rgba(232,221,199,0.18);
    border:1px solid rgba(232,221,199,0.25);
    transition:all .5s ease;
  }
  .lamp.lit{
    background:var(--gold-bright);
    border-color:var(--gold-bright);
    box-shadow:0 0 10px 2px rgba(224,181,99,0.55);
  }

  .card{
    background:linear-gradient(180deg, var(--night-panel), var(--night-mid));
    border:1px solid var(--line);
    border-radius:6px;
    padding:40px clamp(22px,5vw,52px);
    position:relative;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
  }
  .card::before{
    content:"";
    position:absolute; left:0; top:24px; bottom:24px; width:2px;
    background:linear-gradient(180deg, transparent, var(--gold), transparent);
    opacity:0.6;
  }

  .instrument-tag{
    display:flex; justify-content:center; align-items:center;
    margin-bottom:22px;
  }
  .instrument-tag img{
    width:52px; height:52px;
    object-fit:contain;
  }

  .step-q{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:clamp(23px,5.6vw,32px);
    line-height:1.4;
    margin:0 0 26px;
    color:var(--parchment);
  }
  .step-q em{ font-style:italic; color:var(--gold-bright); }
  .step-hint{
    font-size:15px; color:var(--parchment-dim); margin-top:-16px; margin-bottom:24px; font-weight:300; line-height:1.6;
  }

  input[type="text"]{
    width:100%;
    background:rgba(13,11,8,0.5);
    border:1px solid var(--line);
    border-radius:4px;
    padding:15px 16px;
    color:var(--parchment);
    font-family:'Frank Ruhl Libre', serif;
    font-size:17px;
    margin-bottom:14px;
    transition:border-color .2s ease, background .2s ease;
  }
  input[type="text"]:focus{
    outline:none;
    border-color:var(--gold);
    background:rgba(13,11,8,0.75);
  }
  input[type="text"]::placeholder{ color:rgba(232,221,199,0.32); }

  .field-group{ display:flex; flex-direction:column; gap:0; }
  .field-tag{
    font-family:'Space Mono', monospace;
    font-size:11px; color:var(--parchment-dim); letter-spacing:0.06em;
    margin:0 0 6px 2px;
  }

  .actions{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:30px; gap:12px;
  }
  button{
    font-family:'Space Mono', monospace;
    letter-spacing:0.06em;
    font-size:13px;
    border-radius:3px;
    padding:14px 22px;
    cursor:pointer;
    border:1px solid transparent;
    transition:all .2s ease;
  }
  .btn-primary{
    background:var(--gold);
    color:var(--night-deep);
    font-weight:700;
    border-color:var(--gold);
    margin-left:auto;
  }
  .btn-primary:hover{ background:var(--gold-bright); border-color:var(--gold-bright); }
  .btn-primary:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn-ghost{
    background:transparent;
    color:var(--parchment-dim);
    border-color:var(--line);
  }
  .btn-ghost:hover{ color:var(--parchment); border-color:var(--parchment-dim); }
  .btn-ghost:disabled{ opacity:0; pointer-events:none; }

  .error-msg{
    color:var(--wine-bright);
    font-family:'Space Mono', monospace;
    font-size:12.5px;
    margin-top:-8px; margin-bottom:16px;
    display:none;
  }

  /* Loading state */
  .loading-wrap{ text-align:center; padding:36px 0; }
  .loading-wrap .step-q{ margin-bottom:10px; }
  .candle{
    width:2px; height:46px; margin:22px auto 0;
    background:linear-gradient(180deg, var(--gold-bright), var(--wine));
    position:relative;
    animation:flicker 1.6s ease-in-out infinite;
    border-radius:2px;
  }
  @keyframes flicker{
    0%,100%{ opacity:0.5; transform:scaleY(1); }
    50%{ opacity:1; transform:scaleY(1.08); }
  }

  /* Result */
  .result{ text-align:center; }
  .superscription{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(18px,4.6vw,22px);
    letter-spacing:0.03em;
    color:var(--gold-bright);
    line-height:1.75;
    margin:0 0 26px;
  }
  .superscript-divider{
    width:44px; height:1px; background:var(--line);
    margin:0 auto 26px;
  }
  .psalm-verse{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(21px,5.6vw,27px);
    line-height:1.85;
    color:var(--parchment);
    margin:0 0 26px;
    white-space:pre-line;
  }
  .result-divider{
    width:60px; height:1px; background:var(--gold);
    margin:8px auto 30px; opacity:0.6;
  }
  .result-meta{
    font-family:'Space Mono', monospace;
    font-size:11px; color:var(--parchment-dim);
    letter-spacing:0.06em; text-transform:uppercase;
    margin-bottom:36px;
    line-height:1.8;
  }
  .result-meta span{ color:var(--gold); }

  footer.foot{
    text-align:center; margin-top:40px;
    font-family:'Space Mono', monospace;
    font-size:11px; color:rgba(232,221,199,0.35);
    letter-spacing:0.05em;
  }

  @media (max-width:520px){
    .card{ padding:32px 20px; }
    .actions{ flex-wrap:wrap; }
  }
</style>
</head>
<body>

<div id="stars"></div>

<div class="wrap">
  <header class="top">
    <h1 class="title">La poesía hebrea: un amigo a conocer</h1>
    <p class="subtitle-main">Como David, podemos usar la música como medio para expresar cómo nos sentimos en este momento. Con unos pocos elementos podemos crear nuestro propio salmo.</p>
    <p class="subtitle-invite">¿Te apuntas?</p>
  </header>

  <div class="lamps" id="lamps">
    <div class="lamp" data-i="0"></div>
    <div class="lamp" data-i="1"></div>
    <div class="lamp" data-i="2"></div>
    <div class="lamp" data-i="3"></div>
    <div class="lamp" data-i="4"></div>
  </div>

  <div class="card" id="card"></div>
</div>

    s.style.top = Math.random()*100+'vh';
    s.style.animationDelay = (Math.random()*4)+'s';
    document.body.appendChild(s);
  }
})();

let harpAudio = null;
function playHarpSound(){
  try {
    if(!harpAudio){
      harpAudio = new Audio("data:audio/mpeg;base64," + HARP_SOUND_B64);
      harpAudio.volume = 0.6;
    }
    harpAudio.currentTime = 0;
    harpAudio.play().catch(() => {
      // Algunos navegadores bloquean autoplay hasta la primera interacción;
      // como esto ocurre después de que el estudiante hizo clic en "Escribir mi salmo",
      // normalmente se reproduce sin problema.
    });
  } catch(err) {
    // si falla el audio, el salmo se muestra igual
  }
}

// ---------- State machine ----------
const state = {
  step: 0, // 0..4 = preguntas, 5 = componiendo, 6 = resultado
  nombre: '',
  personaje: '',
  atributos: ['', '', ''],
  sentimientos: ['', '', ''],
  necesidades: ['', ''],
  salmo: '',
  superscript: ''
};

const steps = [
  {
    key:'nombre',
    q: () => '¿Cuál es tu nombre?',
    hint: () => 'Así firmaremos tu salmo, como los salmos de David llevan su nombre.',
    render: () => `
      <input type="text" id="in-nombre" placeholder="Ej: María, Diego..." value="${escapeAttr(state.nombre)}" autocomplete="off">
    `,
    read: () => { state.nombre = val('in-nombre'); },
    valid: () => state.nombre.trim().length > 0
  },
  {
    key:'personaje',
    q: () => '¿En quién quieres pensar al escribir tu salmo?',
    hint: () => 'Puede ser Dios, Jesucristo, una persona real, o alguien que llevas en el corazón.',
    render: () => `
      <input type="text" id="in-personaje" placeholder="Ej: Jesucristo, mi madre, un amigo..." value="${escapeAttr(state.personaje)}" autocomplete="off">
    `,
    read: () => { state.personaje = val('in-personaje'); },
    valid: () => state.personaje.trim().length > 0
  },
  {
    key:'atributos',
    q: () => `Si tuvieras que describir a <em>${escapeHtml(state.personaje)}</em> con tres atributos, ¿cuáles elegirías?`,
    hint: () => 'Cualidades que lo describen — ej: fiel, fuerte, paciente.',
    render: () => `
      <div class="field-group">
        <div class="field-tag">Atributo 1</div>
        <input type="text" id="in-atr-0" placeholder="Ej: fiel" value="${escapeAttr(state.atributos[0])}" autocomplete="off">
        <div class="field-tag">Atributo 2</div>
        <input type="text" id="in-atr-1" placeholder="Ej: fuerte" value="${escapeAttr(state.atributos[1])}" autocomplete="off">

        <input type="text" id="in-atr-2" placeholder="Ej: paciente" value="${escapeAttr(state.atributos[2])}" autocomplete="off">
      </div>
    `,
    read: () => { state.atributos = [val('in-atr-0'), val('in-atr-1'), val('in-atr-2')]; },
    valid: () => state.atributos.every(a => a.trim().length > 0)
  },
  {
    key:'sentimientos',
    q: () => `Cuando piensas en <em>${escapeHtml(state.personaje)}</em>, ¿qué tres sentimientos vienen a tu mente?`,
    hint: () => 'Ej: paz, gratitud, nostalgia, esperanza.',
    render: () => `
      <div class="field-group">
        <div class="field-tag">Sentimiento 1</div>
        <input type="text" id="in-sen-0" placeholder="Ej: paz" value="${escapeAttr(state.sentimientos[0])}" autocomplete="off">
        <div class="field-tag">Sentimiento 2</div>
        <input type="text" id="in-sen-1" placeholder="Ej: gratitud" value="${escapeAttr(state.sentimientos[1])}" autocomplete="off">
        <div class="field-tag">Sentimiento 3</div>
        <input type="text" id="in-sen-2" placeholder="Ej: esperanza" value="${escapeAttr(state.sentimientos[2])}" autocomplete="off">
      </div>
    `,
    read: () => { state.sentimientos = [val('in-sen-0'), val('in-sen-1'), val('in-sen-2')]; },
    valid: () => state.sentimientos.every(s => s.trim().length > 0)
  },
  {
    key:'necesidades',
    isLast:true,
    q: () => '¿Qué dos asuntos ocupan hoy tu mente y tu corazón?',
    hint: () => 'Lo que hoy más necesitas — ej: fuerza, claridad, descanso.',
    render: () => `
      <div class="field-group">
        <div class="field-tag">Asunto 1</div>
        <input type="text" id="in-nec-0" placeholder="Ej: fuerza" value="${escapeAttr(state.necesidades[0])}" autocomplete="off">
        <div class="field-tag">Asunto 2</div>
        <input type="text" id="in-nec-1" placeholder="Ej: claridad" value="${escapeAttr(state.necesidades[1])}" autocomplete="off">
      </div>
    `,
    read: () => { state.necesidades = [val('in-nec-0'), val('in-nec-1')]; },
    valid: () => state.necesidades.every(n => n.trim().length > 0)
  }
];

function val(id){ return (document.getElementById(id)?.value || '').trim(); }
function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }
function escapeHtml(s){
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateLamps(){
  const lit = state.step >= 6 ? 5 : state.step;
  document.querySelectorAll('.lamp').forEach((l,i)=>{
    l.classList.toggle('lit', i < lit);
  });
}

function render(){
  updateLamps();
  const card = document.getElementById('card');

  if(state.step <= 4){
    const s = steps[state.step];
    const instrument = INSTRUMENTS[state.step % INSTRUMENTS.length];
    card.innerHTML = `
      <div class="instrument-tag">${ICONS[instrument]}</div>
      <h2 class="step-q">${s.q()}</h2>
      <div class="step-hint">${s.hint()}</div>
      ${s.render()}
      <div class="error-msg" id="error-msg">Por favor completa todos los campos antes de continuar.</div>
      <div class="actions">
        <button class="btn-ghost" id="btn-back" ${state.step===0?'disabled':''}>&larr; Atrás</button>
        <button class="btn-primary" id="btn-next">${s.isLast ? 'Escribir mi salmo &rarr;' : 'Continuar &rarr;'}</button>
      </div>
    `;
    bindStepEvents(s);
  } else if(state.step === 5){
    card.innerHTML = `
      <div class="loading-wrap">
        <h2 class="step-q">Encendiendo la lámpara del poeta&hellip;</h2>
        <div class="step-hint">Tejiendo tus palabras al estilo de los salmos de David.</div>
        <div class="candle"></div>
      </div>
    `;
    generatePsalm();
  } else if(state.step === 6){
    card.innerHTML = `
      <div class="result">
        <div class="superscription">${escapeHtml(state.superscript).replace(/\n/g,'<br>')}</div>
        <div class="superscript-divider"></div>
        <div class="psalm-verse">${escapeHtml(state.salmo)}</div>
        <div class="result-divider"></div>
        <div class="actions" style="justify-content:center;">
          <button class="btn-ghost" id="btn-restart">Escribir otro salmo</button>
        </div>
      </div>
    `;
    document.getElementById('btn-restart').addEventListener('click', restart);
    playHarpSound();
  }
}

function bindStepEvents(s){
  document.getElementById('btn-next').addEventListener('click', () => {
    s.read();
    if(!s.valid()){
      document.getElementById('error-msg').style.display = 'block';
      return;
    }
    state.step++;
    render();
  });
  const backBtn = document.getElementById('btn-back');
  if(backBtn && !backBtn.disabled){
    backBtn.addEventListener('click', () => {
      s.read();
      state.step--;
      render();
    });
  }
  document.querySelectorAll('#card input[type="text"]').forEach(inp => {
    inp.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        e.preventDefault();
        document.getElementById('btn-next').click();
      }
    });
  });
  const firstInput = document.querySelector('#card input[type="text"]');
  if(firstInput) firstInput.focus();
}

function restart(){
  state.step = 0;
  state.nombre = '';
  state.personaje = '';
  state.atributos = ['', '', ''];
  state.sentimientos = ['', '', ''];
  state.necesidades = ['', ''];
  state.salmo = '';
  state.superscript = '';
  render();
}

// ---------- Local psalm composer (no external calls — works on any host) ----------
function lc(w){ w = (w||'').trim(); return w ? w.charAt(0).toLowerCase() + w.slice(1) : w; }
function cap(w){ w = (w||'').trim(); return w ? w.charAt(0).toUpperCase() + w.slice(1) : w; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function normalizeStr(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

// Lightweight Spanish gender heuristic so articles ("el/la", "del/de la", "este/esta") agree
function gen(word){
  const w = normalizeStr(word);
  const excMasc = ['dia','mapa','planeta','problema','tema','sistema','clima','poema','idioma','programa','drama','fantasma','esquema','sofa'];
  if(excMasc.includes(w)) return 'm';
  if(/(cion|sion|dad|tud|umbre|eza|ncia|anza|ie)$/.test(w)) return 'f';
  const excFemConsonant = ['paz','luz','fe','sed','miel','sal','vejez','ninez','flor','labor','razon','ley'];
  if(excFemConsonant.includes(w)) return 'f';
  if(/a$/.test(w)) return 'f';
  return 'm';
}
function art(word){ return gen(word) === 'f' ? 'la' : 'el'; }
function delArt(word){ return gen(word) === 'f' ? 'de la' : 'del'; }
function dem(word){ return gen(word) === 'f' ? 'esta' : 'este'; }

// Heuristic for the gender of the person the psalm is about (personaje) — kept
// in case future templates need it; current templates avoid needing it at all
// by only ever placing atributos after "eres" (predicate position), which is
// grammatically valid no matter what word or gender the student types.
function nameGender(name){
  const n = normalizeStr(name).trim().split(/\s+/)[0] || '';
  if(!n) return 'm';
  const mascExceptions = ['josue','moises','elias','isaias','matias','tobias','jonas','lucas','andres','jesus','nicolas','ines'];
  if(mascExceptions.includes(n)) return 'm';
  if(n.endsWith('a')) return 'f';
  return 'm';
}

// Detects whether the psalm is addressed to God / Jesucristo / Espíritu Santo,
// which unlocks divine metaphors (roca, pastor, clamor). Anyone else is treated
// at a human level, per the exercise's rules.
function isDivine(personaje){
  const n = normalizeStr(personaje);
  const keywords = [
    'dios','jehova','jesus','jesucristo','cristo','espiritu santo',
    'padre celestial','elohim','yahve','yahweh','todopoderoso','el senor'
  ];
  return keywords.some(k => n.includes(k));
}

function makeSuperscript(d){
  const instrumento = pick(INSTRUMENTS);
  return `Al músico principal: con ${instrumento}.\nSalmo de ${cap(d.nombre)}.`;
}

// Every line is built so atributos (a1,a2,a3) ONLY ever follow "eres" / "Qué ... eres"
// (predicate-adjective position). That's the one slot in Spanish where any word a
// student types — adjective, participle, whatever gender — reads correctly.
// Sentimientos and necesidades are safe as nouns, so those can vary more freely.
function buildVerses(d){
  const personaje = cap(d.personaje);
  const [a1,a2,a3] = d.atributos.map(lc);
  const [s1,s2,s3] = d.sentimientos.map(lc);
  const [n1,n2] = d.necesidades.map(lc);
  const divine = isDivine(d.personaje);

  let v1Line1, v1Line2, v2Line1, v2Line2;

  if(divine){
    const v1L1 = [
      `Tú eres ${a1}, ${a2} y ${a3}, oh ${personaje},`,
      `Eres ${a1}, ${a2} y ${a3}, oh ${personaje}, mi Dios y mi pastor,`,
      `Qué ${a1}, ${a2} y ${a3} eres, oh ${personaje},`,
      `Cuán ${a1}, ${a2} y ${a3} eres, oh ${personaje},`
    ];
    const v1L2 = [
      `hoy siento ${s1}, y en tu presencia esto se convierte en ${s2}.`,
      `mi alma conoce ${art(s1)} ${s1}, y también ${s2} cuando pienso en ti.`,
      `en medio ${delArt(s1)} ${s1}, tu fidelidad me regala ${s2}.`,
      `camino hoy entre ${art(s1)} ${s1} y ${art(s2)} ${s2}, sabiendo que tú me guías.`
    ];
    const v2L1 = [
      `Pongo delante de ti, oh ${personaje}, ${n1} y ${n2},`,
      `Traigo ante ti, oh ${personaje}, ${n1} y ${n2},`,
      `Levántate, oh ${personaje}, y ayúdame con ${n1} y ${n2},`,
      `Escucha mi oración, oh ${personaje}, sobre ${n1} y ${n2},`
    ];
    const v2L2 = [
      `pues hoy siento ${s3}, y en ti hallo mi fuerza.`,
      `porque mi ${s3} se convierte en confianza cuando pienso en ti.`,
      `y agradezco ${art(s3)} ${s3} que siento junto a ti.`,
      `porque tu fidelidad acompaña ${art(s3)} ${s3} que hoy llevo.`
    ];
    v1Line1 = pick(v1L1); v1Line2 = pick(v1L2);
    v2Line1 = pick(v2L1); v2Line2 = pick(v2L2);
  } else {
    const v1L1 = [
      `Eres ${a1}, ${a2} y ${a3}, ${personaje},`,
      `Tú eres ${a1}, ${a2} y ${a3}, ${personaje}, y eso nunca lo olvido,`,
      `Qué ${a1}, ${a2} y ${a3} eres, ${personaje},`,
      `Cuán ${a1}, ${a2} y ${a3} eres, ${personaje},`
    ];
    const v1L2 = [
      `hoy siento ${s1}, y pensar en ti me trae ${s2}.`,
      `mi corazón conoce ${art(s1)} ${s1}, y también ${s2} cuando estás cerca.`,
      `en medio ${delArt(s1)} ${s1}, tu cercanía no se aparta de mí.`,
      `entre ${art(s1)} ${s1} y ${art(s2)} ${s2}, pensar en ti me acompaña.`
    ];
    const v2L1 = [
      `Hoy llevo en el corazón ${n1} y ${n2}, ${personaje},`,
      `Pienso en ti junto con ${n1} y ${n2}, ${personaje},`,
      `Te escribo pensando en ${n1} y ${n2}, ${personaje},`,
      `Hoy comparto contigo ${n1} y ${n2}, ${personaje},`
    ];
    const v2L2 = [
      `pues cuando pienso en ti, ${art(s3)} ${s3} se convierte en gratitud.`,
      `y agradezco ${art(s3)} ${s3} que siento junto a ti.`,
      `así como tu cercanía acompaña ${art(s3)} ${s3} que hoy llevo.`,
      `porque pensar en ti transforma ${art(s3)} ${s3} en algo hermoso.`
    ];
    v1Line1 = pick(v1L1); v1Line2 = pick(v1L2);
    v2Line1 = pick(v2L1); v2Line2 = pick(v2L2);
  }

  return `${v1Line1}\n${v1Line2}\n\n${v2Line1}\n${v2Line2}`;
}

async function generatePsalm(){
  state.superscript = makeSuperscript(state);

  if (API_ENDPOINT) {
    try {
      const res = await fetch(API_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          nombre: state.nombre,
          personaje: state.personaje,
          atributos: state.atributos,
          sentimientos: state.sentimientos,
          necesidades: state.necesidades
        })
      });
      if (res.ok) {
        const data = await res.json();
        if (data.salmo) {
          state.salmo = data.salmo;
          state.step = 6;
          render();
          return;
        }
      }
    } catch (err) {
      // sin conexión o el Worker no respondió — seguimos al respaldo local
    }
  }
  // Respaldo local: nunca deja al estudiante sin salmo
  setTimeout(() => {
    state.salmo = buildVerses(state);
    state.step = 6;
    render();
  }, 700);
}

render();
</script>
