// registro global de tarjetas en orden de aparición, para el boton "siguiente"
const allCards = [];

function makeNextHint(idx) {
  const hint = document.createElement("div");
  hint.className = "next-hint";
  hint.innerHTML = `<span>Siguiente</span><span class="chev">&rsaquo;</span>`;
  hint.addEventListener("click", (e) => {
    e.stopPropagation();
    goToNext(idx);
  });
  return hint;
}

function goToNext(idx) {
  const current = allCards[idx];
  current.cardEl.classList.remove("flipped");
  const next = allCards[idx + 1];
  if (next) {
    next.wrapEl.scrollIntoView({ behavior: "smooth", block: "center" });
  } else {
    const introSection = document.getElementById("grid-intro");
    if (introSection) introSection.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

function buildPhotoCard(item, idx) {
  const wrap = document.createElement("div");
  wrap.className = "card-wrap";
  const loadAttr = idx === 0 ? `loading="eager" fetchpriority="high"` : `loading="lazy"`;
  wrap.innerHTML = `
    <div class="card">
      <div class="face face-front photo">
        <img src="${photoSrc[item.key]}" alt="${item.name}" ${loadAttr}>
        <div class="front-caption">Toca para leer más</div>
      </div>
      <div class="face face-back back-photo">
        <div class="back-sub">${item.role}</div>
        <h3 class="back-title">${item.name}</h3>
        <div class="back-line"></div>
        <p class="back-text">${item.text}</p>
        <p class="back-ref">${item.ref}</p>
      </div>
    </div>
  `;
  const card = wrap.querySelector(".card");
  const backFace = wrap.querySelector(".face-back");
  backFace.appendChild(makeNextHint(idx));
  wrap.addEventListener("click", () => card.classList.toggle("flipped"));
  allCards.push({ wrapEl: wrap, cardEl: card });
  return wrap;
}

function buildBarCard(item, catClass) {
  const row = document.createElement("div");
  row.className = "acc-row";
  row.innerHTML = `
    <div class="acc-header acc-${catClass}">
      <img class="acc-icon" src="${TEMPLE_ICON}" alt="Templo" loading="lazy">
      <div class="acc-text">
        <div class="acc-name">${item.name}</div>
        <div class="acc-role">${item.role}</div>
      </div>
      <svg class="acc-chevron" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="acc-body">
      <div class="acc-body-inner">
        <div class="acc-line"></div>
        <p class="acc-text-body">${item.text}</p>
        <p class="acc-ref">${item.ref}</p>
      </div>
    </div>
  `;

  const body = row.querySelector(".acc-body");
  const inner = row.querySelector(".acc-body-inner");

  row.addEventListener("click", () => {
    const isOpen = row.classList.toggle("open");
    if (isOpen) {
      body.style.maxHeight = inner.scrollHeight + "px";
    } else {
      body.style.maxHeight = "0px";
    }
  });

  window.addEventListener("resize", () => {
    if (row.classList.contains("open")) {
      body.style.maxHeight = inner.scrollHeight + "px";
    }
  });

  return row;
}

}
